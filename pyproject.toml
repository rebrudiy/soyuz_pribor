[dependency-groups]
app = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]
dev = [
    { include-group = "app" },
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
